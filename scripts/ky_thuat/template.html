<style>
/* Layout: one narrow column, sticky search band on top, result cards that expand in place */
:root {

        <li><b>Danh mục tương đương theo QĐ 7603/QĐ-BYT, giá TT39/TT13</b> <span class="d">dữ liệu hiện tại</span><p>Nguồn của trang này (từ bản 2.8.0): mỗi kỹ thuật theo TT43/2013, TT50/2014, TT21/2017 được đối chiếu với tên dịch vụ, mã và giá trong TT39/2018 (sửa đổi bởi TT13/2019), kèm giá TT15/2018, TTLT 37/2015 và TT37/2018 để so sánh.</p><details class="refd"><summary>Chi tiết</summary><ul><li><b>QĐ 7603/QĐ-BYT</b> (25/12/2018): bộ mã danh mục dùng chung áp dụng trong quản lý khám chữa bệnh và thanh toán BHYT (phiên bản 6), gồm mã dịch vụ kỹ thuật dạng <i>chương.số TT43.mã giá</i> (vd 01.0009.0098, cột “Mã tương đương”); được sửa đổi, bổ sung bởi QĐ 4905/QĐ-BYT (2019).</li><li>Cột “QĐ phê duyệt” liệt kê các quyết định phê duyệt danh mục tương đương được đánh dấu trong file nguồn (QĐ 466, 24, 130, 423, 1035, 1410, 473). File không ghi năm ban hành của các quyết định này.</li><li>Cột “Thay đổi giá / ghi chú” đánh dấu dòng có giá hoặc ghi chú khác danh mục trước (hiện trong tab Giá).</li><li>So với bản 4442/4883 trước đây: không còn dòng “đã hủy”; thêm giá TT39, TT13, TT37/2018; bỏ cột TT02/2017.</li></ul><p class="st"><b>Hiệu lực hiện nay:</b> mã kỹ thuật TT43 vẫn dùng ở Phụ lục 01 TT23/2024 đến hết 31/12/2027; các bảng giá trong file đều đã được thay (xem TT39/2018).</p><p class="srcs">Nguồn: <a href="https://thuvienphapluat.vn/van-ban/Bao-hiem/Quyet-dinh-4905-QD-BYT-2019-sua-doi-Quyet-dinh-7603-QD-BYT-ma-danh-muc-dung-chung-426580.aspx" target="_blank" rel="noopener">thuvienphapluat (QĐ 4905 sửa đổi QĐ 7603)</a></p></details></li>
        <li><b>Quyết định 4442/QĐ-BYT</b> <span class="d">13/07/2018</span><p>Bộ Y tế phê duyệt danh mục kỹ thuật tương đương: đối chiếu từng kỹ thuật theo TT43, TT50, TT21 với tên dịch vụ và mức giá trong TT15/2018 để làm căn cứ thanh toán BHYT. Là nguồn chính của phụ lục.</p><details class="refd"><summary>Chi tiết</summary><ul><li>Tên đầy đủ: ban hành danh mục các dịch vụ kỹ thuật khám bệnh, chữa bệnh được xếp tương đương về kỹ thuật và chi phí thực hiện theo TT15/2018. Ký 13/07/2018 (Thứ trưởng Nguyễn Viết Tiến), hiệu lực từ ngày ký.</li><li>Là danh mục tương đương “đợt 4”: đối chiếu kỹ thuật theo TT43/2013, TT50/2014, TT21/2017 với dịch vụ đã có giá trong TT15/2018, làm cơ sở thanh toán chi phí khám chữa bệnh.</li><li>Phụ lục 01 thống nhất tên dịch vụ tương đương; Phụ lục 02 bổ sung mã giá mới để liên thông dữ liệu thanh toán BHYT (cột “Mã giá liên thông BHYT”).</li><li>Thay thế các QĐ tương đương năm 2016: 803, 984, 1016, 1724, 3025/QĐ-BYT.</li></ul><p class="st"><b>Hiệu lực hiện nay:</b> hết hiệu lực từ 15/12/2018. Trang này dùng bản 4442/4883 đến 2.7.1; từ 2.8.0 dùng danh mục QĐ 7603/TT13. Cột “QĐ tương đương cũ (theo TT37)” còn ghi 3025, 4442.</p><p class="st"><b>Văn bản thay thế, sửa đổi:</b></p><ul><li><b>QĐ 7435/QĐ-BYT</b> (ký 14/12/2018, Thứ trưởng Nguyễn Viết Tiến; hiệu lực 15/12/2018): thay thế QĐ 4442 và QĐ 4883 (Điều 3).</li><li>Danh mục tương đương giữa kỹ thuật theo TT43/2013, TT50/2014, TT21/2017 và danh mục giá theo <b>TT39/2018</b> (Phụ lục 1), kế thừa danh mục tương đương hiện hành và sửa đổi, bổ sung một số mã (Phụ lục 2).</li><li>Một số thay đổi: thống nhất tên dịch vụ (vd “đặt catheter động mạch” thành “đặt catheter động mạch theo dõi huyết áp liên tục”), hủy một số mã tương đương.</li><li>Chưa tìm thấy văn bản thay thế QĐ 7435.</li></ul><p class="srcs">Nguồn: <a href="https://luatvietnam.vn/y-te/quyet-dinh-4442-qd-byt-2018-danh-muc-cac-dich-vu-ky-thuat-kham-chua-benh-165218-d1.html" target="_blank" rel="noopener">luatvietnam (QĐ 4442)</a> · <a href="https://luatvietnam.vn/y-te/quyet-dinh-7435-qd-byt-229023-d1.html" target="_blank" rel="noopener">luatvietnam (QĐ 7435)</a></p></details></li>
        <li><b>Quyết định 4883/QĐ-BYT</b> <span class="d">08/08/2018</span><p>Sửa đổi, bổ sung danh mục tương đương của QĐ 4442: thêm một số kỹ thuật và hủy một số dòng (trong phụ lục ghi “đã hủy QĐ 4883”).</p><details class="refd"><summary>Chi tiết</summary><ul><li>Ngày 08/08/2018. Bổ sung 256 dịch vụ tương đương (đã có trong danh mục tương đương theo TTLT 37/2015 nhưng chưa có trong QĐ 4442).</li><li>Hủy 09 mã tương đương không phù hợp và đính chính lỗi chính tả ở Phụ lục 1 của QĐ 4442 (trong phụ lục ghi “đã hủy QĐ 4883”).</li><li>Chưa đọc được nguyên văn; nội dung theo QĐ 7435 và trang tóm tắt văn bản.</li></ul><p class="st"><b>Hiệu lực hiện nay:</b> hết hiệu lực từ 15/12/2018.</p><p class="st"><b>Văn bản thay thế, sửa đổi:</b></p><ul><li><b>QĐ 7435/QĐ-BYT</b> (hiệu lực 15/12/2018) thay thế cả QĐ 4442 và QĐ 4883; xem chi tiết ở mục QĐ 4442.</li></ul><p class="srcs">Nguồn: <a href="https://luatvietnam.vn/tin-van-ban-moi/bo-sung-256-dich-vu-ky-thuat-kham-chua-benh-bhyt-186-17268-article.html" target="_blank" rel="noopener">luatvietnam (tin văn bản)</a> · <a href="https://luatvietnam.vn/y-te/quyet-dinh-7435-qd-byt-229023-d1.html" target="_blank" rel="noopener">luatvietnam (QĐ 7435)</a></p></details></li>
        <li><b>Thông tư 43/2013/TT-BYT</b><p>Quy định chi tiết phân tuyến chuyên môn kỹ thuật trong hệ thống khám bệnh, chữa bệnh. Nguồn của mã kỹ thuật và cột phân tuyến A–D.</p><details class="refd"><summary>Chi tiết</summary><ul><li>Ký 11/12/2013, hiệu lực 01/02/2014; bãi bỏ QĐ 23/2005/QĐ-BYT. Quy định chi tiết phân tuyến chuyên môn kỹ thuật đối với hệ thống cơ sở khám bệnh, chữa bệnh.</li><li>4 tuyến (Điều 3): <b>tuyến 1 – trung ương</b> (bệnh viện hạng đặc biệt, hạng I thuộc Bộ Y tế, hạng I thuộc Sở Y tế/bộ ngành được giao tuyến cuối); <b>tuyến 2 – tỉnh</b> (bệnh viện hạng II trở xuống thuộc Bộ Y tế, hạng I–II thuộc Sở Y tế/bộ ngành); <b>tuyến 3 – huyện</b> (bệnh viện hạng III, IV, chưa xếp hạng, trung tâm y tế huyện, phòng khám, nhà hộ sinh); <b>tuyến 4 – xã</b> (trạm y tế xã, trạm y tế cơ quan, phòng khám bác sĩ gia đình). Cơ sở tư nhân do cơ quan cấp phép xếp tuyến.</li><li>Danh mục kỹ thuật 28 chuyên khoa (Điều 4): cột 3A, 3B, 3C, 3D là kỹ thuật thực hiện tại tuyến 1, 2, 3, 4 (cột “Tuyến” A–D trong trang này).</li><li>Nguyên tắc: phân tuyến không hạn chế phát triển kỹ thuật (Điều 2); cơ sở phải thực hiện được đa số kỹ thuật của tuyến mình, được khuyến khích làm kỹ thuật tuyến trên, tuyến trên hạn chế làm kỹ thuật tuyến dưới đã làm được (Điều 4). Muốn làm kỹ thuật tuyến trên phải đủ điều kiện và được Bộ trưởng Bộ Y tế hoặc Giám đốc Sở Y tế phê duyệt (Điều 5–9).</li></ul><p class="st"><b>Hiệu lực hiện nay:</b> <b>hết hiệu lực từ 18/10/2024</b> (bãi bỏ bởi Điều 3 TT23/2024/TT-BYT).</p><p class="st"><b>Văn bản thay thế, sửa đổi:</b></p><ul><li><b>TT23/2024/TT-BYT</b> (ký 18/10/2024, hiệu lực cùng ngày): ban hành danh mục kỹ thuật mới, bãi bỏ TT43/2013 và TT21/2017. Phụ lục 01 xếp theo chuyên khoa (kế thừa danh mục cũ), Phụ lục 02 xếp theo hệ cơ quan, cấu trúc giải phẫu.</li><li><b>Thông tư sửa đổi năm 2026</b> (Điều 3 hiệu lực 01/07/2026): Phụ lục 01 thực hiện <b>đến hết 31/12/2027</b>, Phụ lục 02 <b>từ 01/01/2028</b>; cơ sở đã có giấy phép tiếp tục các kỹ thuật đã được phê duyệt đến 31/12/2027.</li><li>Số thứ tự theo chương của TT43/2013 và TT21/2017 <b>tiếp tục dùng làm mã kỹ thuật</b> ở Phụ lục 01 (vd chương II, kỹ thuật số 10 → mã 2.10); kỹ thuật đã phân loại theo TT50/2014 giữ nguyên mức phân loại.</li></ul><p class="srcs">Nguồn: <a href="https://vnras.com/thong-tu-43-2013-tt-byt/" target="_blank" rel="noopener">vnras (nguyên văn TT43)</a> · <a href="https://caselaw.vn/van-ban-phap-luat/413187-thong-tu-so-23-2024-tt-byt-ngay-18-10-2024-cua-bo-truong-bo-y-te-ve-danh-muc-ky-thuat-trong-kham-benh-chua-benh" target="_blank" rel="noopener">caselaw (TT23/2024)</a> · <a href="https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/7/22-byt.signed.pdf" target="_blank" rel="noopener">Thông tư sửa đổi 2026 (chinhphu.vn)</a></p></details></li>
        <li><b>Thông tư 50/2014/TT-BYT</b><p>Phân loại phẫu thuật, thủ thuật và định mức nhân lực. Nguồn của cột phân loại (PĐB, P1–P3, TĐB, T1–T3).</p><details class="refd"><summary>Chi tiết</summary><ul><li>Ký 26/12/2014 (Thứ trưởng Nguyễn Thị Xuyên), hiệu lực 15/02/2015; thay QĐ 1904/1998 và QĐ 2590/2004.</li><li>Phân loại phẫu thuật, thủ thuật của 26 chuyên khoa thành loại đặc biệt, I, II, III theo 5 tiêu chí: độ khó và phức tạp, mức nguy hiểm đến tính mạng, phương tiện, số người tham gia, thời gian thực hiện.</li><li>Loại đặc biệt: rất phức tạp, rất nguy hiểm, phần lớn ở tuyến trung ương, 3–4 giờ trở lên. Loại I: khá phức tạp, nguy hiểm, phần lớn ở trung ương và tỉnh, 2–3 giờ. Loại II: ít nguy hiểm hơn loại I, chủ yếu trung ương, tỉnh và một số cơ sở tuyến huyện, 1–3 giờ. Loại III: ít nguy hiểm hơn loại II, chủ yếu tuyến huyện, 1–2 giờ.</li><li>Phụ lục 1: định mức nhân lực tối đa mỗi ca theo chuyên khoa và loại; ca khó (ghép tạng, tim hở…) thủ trưởng cơ sở quyết định vượt định mức.</li><li>Danh mục là căn cứ chi phụ cấp phẫu thuật, thủ thuật theo QĐ 73/2011/QĐ-TTg.</li></ul><p class="st"><b>Hiệu lực hiện nay:</b> các trang tra cứu ghi còn hiệu lực. TT23/2024 (sửa đổi năm 2026) giữ nguyên mức phân loại theo TT50/2014 cho các kỹ thuật thuộc Phụ lục 01, thông qua mã kỹ thuật.</p><p class="srcs">Nguồn: <a href="https://luatvietnam.vn/y-te/thong-tu-50-2014-tt-byt-bo-y-te-92154-d1.html" target="_blank" rel="noopener">luatvietnam</a> · <a href="https://caselaw.vn/van-ban-phap-luat/264179-thong-tu-50-2014-tt-byt-quy-dinh-viec-phan-loai-phau-thuat-thu-thuat-va-dinh-muc-nhan-luc-trong-tung-ca-phau-thuat-thu-thuat-do-bo-y-te-ban-hanh" target="_blank" rel="noopener">caselaw</a> · <a href="https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/7/22-byt.signed.pdf" target="_blank" rel="noopener">Thông tư sửa đổi 2026</a></p></details></li>
        <li><b>Thông tư 21/2017/TT-BYT</b><p>Sửa đổi, bổ sung danh mục kỹ thuật ban hành kèm TT43/2013.</p><details class="refd"><summary>Chi tiết</summary><ul><li>Ký 10/05/2017 (Thứ trưởng Nguyễn Viết Tiến), hiệu lực 25/06/2017.</li><li>Sửa đổi, bổ sung danh mục kỹ thuật kèm TT43/2013: bổ sung kỹ thuật của 25 chuyên khoa, đánh số tiếp theo danh mục cũ.</li></ul><p class="st"><b>Hiệu lực hiện nay:</b> <b>hết hiệu lực từ 18/10/2024</b> (bãi bỏ bởi TT23/2024/TT-BYT).</p><p class="st"><b>Văn bản thay thế, sửa đổi:</b></p><ul><li><b>TT23/2024/TT-BYT</b> (ký 18/10/2024, hiệu lực cùng ngày): ban hành danh mục kỹ thuật mới, bãi bỏ TT43/2013 và TT21/2017. Phụ lục 01 xếp theo chuyên khoa (kế thừa danh mục cũ), Phụ lục 02 xếp theo hệ cơ quan, cấu trúc giải phẫu.</li><li><b>Thông tư sửa đổi năm 2026</b> (Điều 3 hiệu lực 01/07/2026): Phụ lục 01 thực hiện <b>đến hết 31/12/2027</b>, Phụ lục 02 <b>từ 01/01/2028</b>; cơ sở đã có giấy phép tiếp tục các kỹ thuật đã được phê duyệt đến 31/12/2027.</li><li>Số thứ tự theo chương của TT43/2013 và TT21/2017 <b>tiếp tục dùng làm mã kỹ thuật</b> ở Phụ lục 01 (vd chương II, kỹ thuật số 10 → mã 2.10); kỹ thuật đã phân loại theo TT50/2014 giữ nguyên mức phân loại.</li></ul><p class="srcs">Nguồn: <a href="https://luatvietnam.vn/y-te/thong-tu-21-2017-tt-byt-bo-y-te-114423-d1.html" target="_blank" rel="noopener">luatvietnam</a> · <a href="https://caselaw.vn/van-ban-phap-luat/413187-thong-tu-so-23-2024-tt-byt-ngay-18-10-2024-cua-bo-truong-bo-y-te-ve-danh-muc-ky-thuat-trong-kham-benh-chua-benh" target="_blank" rel="noopener">TT23/2024</a> · <a href="https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/7/22-byt.signed.pdf" target="_blank" rel="noopener">Thông tư sửa đổi 2026</a></p></details></li>
        <li><b>Thông tư 39/2018/TT-BYT và 13/2019/TT-BYT</b><p>Giá dịch vụ khám chữa bệnh BHYT thống nhất giữa các bệnh viện cùng hạng trên toàn quốc. Cột “Giá TT39”, “Giá TT13”, “Tên trong danh mục giá”, “Chuyên khoa TT39”.</p><details class="refd"><summary>Chi tiết</summary><ul><li><b>TT39/2018</b>: ký 30/11/2018, hiệu lực 15/01/2019; thay TT15/2018. Giá gồm chi phí trực tiếp và tiền lương; Phụ lục IV ghi chú phạm vi giá (cột “PL4 TT39”).</li><li><b>TT13/2019</b>: ký 05/07/2019, hiệu lực 20/08/2019; sửa đổi TT39/2018, chủ yếu điều chỉnh phần tiền lương trong giá theo mức lương cơ sở mới. Cột “Giá TT13” là mức sau sửa đổi.</li><li>Quy tắc giữ như TT15: lần khám thứ 2 tính 30%; can thiệp phát sinh trong cùng lần phẫu thuật 50% (cùng kíp) hoặc 80% (đổi kíp), thủ thuật phát sinh 80%.</li></ul><p class="st"><b>Hiệu lực hiện nay:</b> hết hiệu lực; thay bằng TT22/2023, rồi TT21/2024.</p><p class="st"><b>Văn bản thay thế, sửa đổi:</b></p><ul><li><b>TT22/2023/TT-BYT</b> (17/11/2023): thay TT39/2018 và TT13/2019.</li><li><b>TT21/2024/TT-BYT</b> (17/10/2024): TT22/2023 hết hiệu lực từ 01/01/2025; giá do cấp có thẩm quyền quy định theo phương pháp định giá của TT21/2024 (xem mục TT15/2018).</li></ul><p class="srcs">Nguồn: <a href="https://baophapluat.vn/tu-1512019-thay-doi-gia-kham-chua-benh-bao-hiem-y-te-post294436.html" target="_blank" rel="noopener">Báo Pháp luật (TT39/2018)</a> · <a href="https://vanban.vcci.com.vn/thong-tu-132019tt-byt-sua-doi-thong-tu-392018tt-byt-quy-dinh-ve-thong-nhat-gia-dich-vu-kham-benh-chua-benh-bao-hiem-y-te" target="_blank" rel="noopener">VCCI (TT13/2019)</a> · <a href="https://luatvietnam.vn/y-te/thong-tu-22-2023-tt-byt-gia-kham-benh-chua-benh-bhyt-benh-vien-cung-hang-277331-d1.html" target="_blank" rel="noopener">luatvietnam (TT22/2023)</a></p></details></li>
        <li><b>Thông tư 15/2018/TT-BYT</b><p>Quy định thống nhất giá dịch vụ khám bệnh, chữa bệnh BHYT giữa các bệnh viện cùng hạng trên toàn quốc. Cột “Giá TT15”.</p><details class="refd"><summary>Chi tiết</summary><ul><li>Ký 30/05/2018 (Thứ trưởng Phạm Lê Tuấn), hiệu lực 15/07/2018; thay TTLT 37/2015.</li><li>Giá dịch vụ BHYT thống nhất giữa các bệnh viện cùng hạng, gồm chi phí trực tiếp và tiền lương (không gồm các khoản ngân sách nhà nước bảo đảm). Phụ lục: I khám, II ngày giường, III kỹ thuật và xét nghiệm, IV ghi chú.</li><li>Bệnh viện áp giá theo hạng tương đương; cơ sở chưa phân hạng, phòng khám tư nhân theo hạng IV; trạm y tế xã theo giá trạm y tế xã.</li><li>Một số quy tắc: từ lần khám thứ 2 trong cùng lần đến chỉ tính 30% (tối đa 2 lần giá); bàn khám trên 65 lượt/ngày thanh toán 50% từ lượt 66; can thiệp phát sinh trong cùng lần phẫu thuật tính 50% (cùng kíp) hoặc 80% (đổi kíp), thủ thuật phát sinh 80%.</li></ul><p class="st"><b>Hiệu lực hiện nay:</b> hết hiệu lực từ 15/01/2019. Giá TT15 là giá năm 2018, không phải giá hiện hành.</p><p class="st"><b>Văn bản thay thế, sửa đổi:</b></p><ul><li><b>TT39/2018/TT-BYT</b> (ký 30/11/2018, hiệu lực 15/01/2019): thay TT15/2018, tiếp tục quy định giá BHYT thống nhất giữa các bệnh viện cùng hạng; được sửa đổi bởi TT13/2019.</li><li><b>TT22/2023/TT-BYT</b> (17/11/2023, Thứ trưởng Lê Đức Luận): thay TT39/2018 và TT13/2019; giữ các quy tắc lần khám thứ 2 tính 30%, bàn khám trên 65 lượt thanh toán 50%; Phụ lục I–V (khám, ngày giường, kỹ thuật, ghi chú, gây tê).</li><li><b>TT21/2024/TT-BYT</b> (17/10/2024): quy định phương pháp định giá dịch vụ khám chữa bệnh (phương pháp chi phí, phương pháp so sánh); TT22/2023, TT21/2023 và TT13/2023 <b>hết hiệu lực từ 01/01/2025</b> (Điều 11). HĐND cấp tỉnh quy định giá cụ thể thuộc thẩm quyền, không vượt giá cao nhất do Bộ trưởng Bộ Y tế quy định (Điều 9).</li><li>Chưa xác định được bảng giá BHYT áp dụng chung toàn quốc hiện nay; giá thực tế tra tại cơ sở hoặc văn bản giá của tỉnh/cấp có thẩm quyền.</li></ul><p class="srcs">Nguồn: <a href="https://vanban.vcci.com.vn/thong-tu-152018tt-byt-quy-dinh-ve-thong-nhat-gia-dich-vu-kham-benh-chua-benh-bao-hiem-y-te-giua-cac-benh-vien-cung-hang-tren-toan-quoc-va-huong-dan-ap-dung-gia-thanh-toan-chi-phi-kham-benh-chua-benh-trong-mot-so-truong-hop-do-bo-truong-bo-y-te-ban-hanh" target="_blank" rel="noopener">VCCI (TT15/2018)</a> · <a href="https://baophapluat.vn/tu-1512019-thay-doi-gia-kham-chua-benh-bao-hiem-y-te-post294436.html" target="_blank" rel="noopener">Báo Pháp luật (TT39/2018)</a> · <a href="https://luatvietnam.vn/y-te/thong-tu-22-2023-tt-byt-gia-kham-benh-chua-benh-bhyt-benh-vien-cung-hang-277331-d1.html" target="_blank" rel="noopener">luatvietnam (TT22/2023)</a> · <a href="https://vcci.com.vn/legal-document/21-2024-tt-byt" target="_blank" rel="noopener">VCCI (TT21/2024)</a></p></details></li>
        <li><b>Thông tư 37/2018/TT-BYT</b><p>Mức tối đa khung giá dịch vụ khám bệnh, chữa bệnh không thuộc phạm vi quỹ BHYT chi trả tại cơ sở nhà nước. Cột “Giá TT37/2018”, “Ghi chú TT37/2018”.</p><details class="refd"><summary>Chi tiết</summary><ul><li>Ký 30/11/2018 (Thứ trưởng Nguyễn Trường Sơn), hiệu lực 15/01/2019.</li><li>Mức tối đa khung giá dịch vụ khám chữa bệnh không thuộc phạm vi thanh toán của quỹ BHYT tại cơ sở nhà nước. HĐND tỉnh quyết định giá cụ thể trong khung; Bộ trưởng Bộ Y tế quyết định với bệnh viện hạng đặc biệt và hạng I thuộc Bộ.</li><li>Quy tắc áp giá tương tự TT15: lần khám thứ 2 tính 30%; can thiệp phát sinh trong cùng ca phẫu thuật 50% (cùng kíp) hoặc 80% (đổi kíp), thủ thuật 80%. Thay thế TT02/2017 và TT44/2017.</li></ul><p class="st"><b>Hiệu lực hiện nay:</b> hết hiệu lực từ 17/11/2023, thay bằng TT21/2023 (theo các trang tra cứu văn bản; chưa đọc được nguyên văn TT21/2023).</p><p class="st"><b>Văn bản thay thế, sửa đổi:</b></p><ul><li><b>TT14/2019/TT-BYT</b> (05/07/2019, hiệu lực 20/08/2019): thay toàn bộ các phụ lục giá của TT37/2018; chủ yếu điều chỉnh tiền lương trong giá, không đổi cấu trúc giá.</li><li><b>TT21/2023/TT-BYT</b> (17/11/2023): khung giá dịch vụ khám chữa bệnh của Nhà nước, thay TT37/2018 và TT14/2019.</li><li><b>TT21/2024/TT-BYT</b> (17/10/2024): TT21/2023 hết hiệu lực từ 01/01/2025; giá được xác định theo phương pháp định giá của TT21/2024 và quyết định của cấp có thẩm quyền (xem mục TT15/2018).</li></ul><p class="srcs">Nguồn: <a href="https://vanban.vcci.com.vn/thong-tu-372018tt-byt-quy-dinh-muc-toi-da-khung-gia-dich-vu-kham-benh-chua-benh-khong-thuoc-pham-vi-thanh-toan-cua-quy-bao-hiem-y-te" target="_blank" rel="noopener">VCCI (TT37/2018)</a> · <a href="https://thuvienphapluat.vn/van-ban/EN/Bao-hiem/Circular-14-2019-TT-BYT-amending-Circular-ceiling-of-price-range-of-medical-examination-services/427232/tieng-anh.aspx" target="_blank" rel="noopener">thuvienphapluat (TT14/2019)</a> · <a href="https://vcci.com.vn/legal-document/21-2024-tt-byt" target="_blank" rel="noopener">VCCI (TT21/2024)</a></p></details></li>
        <li><b>Thông tư liên tịch 37/2015/TTLT-BYT-BTC</b> <span class="d">29/10/2015</span><p>Giá dịch vụ khám chữa bệnh BHYT thống nhất giữa các bệnh viện cùng hạng, trước TT15/2018. Cột “TTLT 37/2015 có lương”.</p><details class="refd"><summary>Chi tiết</summary><ul><li>Liên tịch Bộ Y tế – Bộ Tài chính. Giá có hai mức: gồm chi phí trực tiếp và phụ cấp đặc thù; và gồm thêm tiền lương (áp dụng theo lộ trình). File nguồn chỉ có mức <b>có lương</b>.</li><li><b>Sửa lỗi ghi nhãn:</b> từ 2.1.1 đến 2.7.1 trang này ghi hai cột “TT37 có lương / không lương” là TT37/2018; thực ra đó là hai mức của TTLT 37/2015. TT37/2018 là khung giá không BHYT, nay ở cột riêng “TT37/2018”.</li></ul><p class="st"><b>Hiệu lực hiện nay:</b> hết hiệu lực từ 15/07/2018 (thay bằng TT15/2018).</p><p class="srcs">Nguồn: <a href="https://thuvienphapluat.vn/van-ban/Bao-hiem/joint-Circular-37-2015-TTLT-BYT-BTC-unifying-prices-medical-examination-treatment-services-medical-insurance-310847.aspx" target="_blank" rel="noopener">thuvienphapluat (TTLT 37/2015)</a></p></details></li>

function search() {

    if (st.kind && kindOf(r[F.loai]) !== st.kind) continue;
    if (st.chap !== '' && r[F.chap] !== +st.chap) continue;
    const s = IDX[i];

    if (ok) hits.push(i);

    const sc = new Map(hits.map(i => [i, score(i)]));

  }

}

const BH_CACHE = new Map();
function bh(r) {
  if (BH_CACHE.has(r)) return BH_CACHE.get(r);
  const src = [r[F.gc13] || r[F.gc39]];
  if (r[F.pl4_13] && !src[0].includes(r[F.pl4_13])) src.push(r[F.pl4_13]);
  const excl = [], cond = [], incl = [];
  // tách câu theo . ; nhưng không cắt trong ngoặc; NFC để so khớp dấu tiếng Việt
  const parts = []; let cur = '', depth = 0;
  for (const ch of src.join(' ').normalize('NFC')) {
    if (ch === '(') depth++; else if (ch === ')') depth = Math.max(0, depth - 1);
    if ((ch === '.' || ch === ';') && !depth && !/\d$/.test(cur)) { parts.push(cur); cur = ''; } else cur += ch;
  }
  parts.push(cur);
  for (const s of parts) {
    const x = s.trim().replace(/[.;]$/, ''); if (!x) continue;
    const m = x.match(/chưa (bao gồm|kèm|tính)\s*:?\s*/i);

      if (/bao gồm/i.test(before)) incl.push(before.replace(/^(đã )?bao gồm( cả)?\s*/i, ''));
      excl.push(x.slice(m.index + m[0].length));

    else cond.push(x);

  BH_CACHE.set(r, o);

    <div class="top"><div class="name">${hl(r[F.ten], t)}</div><div class="badges">${badges}</div></div>
    <div class="meta"><span class="code">${hl(r[F.ma], t)}</span> · ${esc(chapLabel(D.chaps[r[F.chap]]))}</div>
    <div class="ctabs" role="tablist" aria-label="Thông tin kỹ thuật">${tabs.map(([id, label]) => `<button type="button" role="tab" id="t${i}-${id}" aria-controls="p${i}-${id}" aria-selected="false" tabindex="-1" data-tab="${id}">${label}</button>`).join('')}</div>
    ${tabs.map(([id, , html]) => `<div class="cpane" role="tabpanel" id="p${i}-${id}" aria-labelledby="t${i}-${id}" data-pane="${id}" hidden>${html}</div>`).join('')}
  </article>`;
}
function renderMore() {
  const end = Math.min(st.shown + PAGE, st.hits.length);
  let h = '';
  for (let j = st.shown; j < end; j++) h += card(st.hits[j]);
  $list.insertAdjacentHTML('beforeend', h);
  $list.querySelectorAll('.ctabs [role=tab]:first-child').forEach(b => b.tabIndex = 0);
  st.shown = end;
  const left = st.hits.length - end;
  $more.hidden = left <= 0;
  $more.textContent = `Xem thêm ${Math.min(PAGE, left)} (còn ${left.toLocaleString('vi-VN')})`;
}

let tm;
$q.addEventListener('input', () => { $clear.hidden = !$q.value; clearTimeout(tm); tm = setTimeout(() => { st.q = $q.value; search(); }, 150); });
$q.addEventListener('keydown', e => { if (e.key === 'Enter') $q.blur(); });
$clear.addEventListener('click', () => { $q.value = ''; $clear.hidden = true; st.q = ''; search(); $q.focus(); });
document.getElementById('kind').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  document.querySelectorAll('#kind .chip').forEach(x => x.setAttribute('aria-pressed', x === b));
  st.kind = b.dataset.v; search();
});
$more.addEventListener('click', renderMore);
const $chap = document.getElementById('chap');
$chap.addEventListener('change', () => { st.chap = $chap.value; $chap.classList.toggle('on', !!$chap.value); search(); });
$intro.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g) { go(g.dataset.go); return; }
});
document.addEventListener('keydown', e => {
  if (e.key === '/' && !e.ctrlKey && !e.metaKey && $reader.hidden && !/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)) { e.preventDefault(); $q.focus(); $q.select(); }
});

// ---- reader for procedures; routed on #qt-N and #quy-trinh so the phone's back button closes it
const $reader = document.getElementById('reader'), $rc = document.getElementById('rcontent'), $crumb = document.getElementById('rcrumb');
let scrollY0 = 0;
function showReader(html, crumb) {
  if ($reader.hidden) scrollY0 = window.scrollY;
  $rc.innerHTML = html; $crumb.textContent = crumb;
  $reader.hidden = false; $reader.scrollTop = 0; document.body.style.overflow = 'hidden';
  document.getElementById('rback').focus({ preventScroll: true });
}
function hideReader() { if ($reader.hidden) return; $reader.hidden = true; document.body.style.overflow = ''; window.scrollTo(0, scrollY0); }
function svcButtons(p) {
  if (!p.rows.length) return '<div class="none">Chưa tìm thấy dịch vụ cùng tên trong danh mục tương đương.</div>';
  return p.rows.map(i => `<button type="button" data-code="${esc(R[i][F.ma])}">${esc(R[i][F.ma])} · ${esc(R[i][F.ten])}</button>`).join('');
}
function renderProc(k) {
  const p = P[k]; if (!p) return renderToc();
  showReader(`<h2 id="rtitle">${esc(sentence(p.t))}</h2><div class="svc">${svcButtons(p)}</div><div class="jump" id="secjump"></div><div class="doc">${p.h}</div>`, `${GROUPS[p.g]} · Quy trình ${k + 1}/${P.length}`);
  const hs = [...$rc.querySelectorAll('.doc p.h2')];
  hs.forEach((h, x) => { h.id = 'sec-' + x; });
  const lab = h => { const s = h.textContent.replace(/^[IVX]+\.\s*/, '').trim().toLocaleLowerCase('vi'); return s.charAt(0).toLocaleUpperCase('vi') + s.slice(1); };
  document.getElementById('secjump').innerHTML = hs.length > 2 ? hs.map((h, x) => `<button type="button" data-jump="sec-${x}">${esc(lab(h))}</button>`).join('') : '';
}
// procedure groups, decided with the department: classified by title
const GROUPS = ['Phẫu thuật', 'Can thiệp mạch', 'Thủ thuật'];
function groupOf(t) {
  const f = fold(t);
  if (/ethanol|tiem xo di dang|chi so abi/.test(f)) return 2;
  if (/^(dat stent|chup|nong |dieu tri suy tinh mach|dieu tri u mau bang hoa chat)/.test(f)) return 1;
  return 0;
}
P.forEach(p => { p.g = groupOf(p.t); });
function renderToc() {
  const n = P.filter(p => p.rows.length).length;
  const item = k => { const p = P[k]; return `<button type="button" data-qt="${k}">${esc(sentence(p.t))}<small class="${p.rows.length ? '' : 'no'}">${p.rows.length ? p.rows.map(i => esc(R[i][F.ma])).join(' · ') : 'Chưa ghép dịch vụ'}</small></button>`; };
  const secs = GROUPS.map((g, gi) => { const ks = P.map((p, k) => k).filter(k => P[k].g === gi); return { g, gi, ks }; });
  showReader(`<h2 id="rtitle">Quy trình kỹ thuật – khoa Phẫu thuật mạch máu</h2>
    <p class="rnote">${P.length} quy trình · ${n} đã ghép với dịch vụ trong phụ lục · ${P.length - n} chưa tìm thấy tên trùng</p>
    <div class="jump">${secs.map(s => `<button type="button" data-jump="grp-${s.gi}">${s.g} <b>${s.ks.length}</b></button>`).join('')}</div>
    ${secs.map(s => `<h3 class="grp" id="grp-${s.gi}">${s.g} <span>${s.ks.length} quy trình</span></h3><div class="toc">${s.ks.map(item).join('')}</div>`).join('')}`, 'Danh sách quy trình');
}
function renderRefs() {
  const P_ = document.getElementById('refsTpl').content.cloneNode(true);
  showReader('<h2 id="rtitle">Văn bản tham chiếu</h2><p class="rnote">Tóm tắt, hiệu lực và văn bản thay thế của các văn bản dùng trong danh mục. Bấm “Chi tiết” ở từng mục.</p>', 'Văn bản tham chiếu');
  $rc.append(P_);
  const nQ = P.filter(p => p.rows.length).length, qn = document.getElementById('qtnote');
  if (qn) qn.textContent = `${P.length} quy trình kỹ thuật của khoa. ${nQ} quy trình đã ghép với dịch vụ có cùng tên trong phụ lục, ${P.length - nQ} quy trình chưa tìm thấy tên trùng.`;
}
function route() {
  const h = location.hash.slice(1), m = h.match(/^qt-(\d+)$/);
  if (m) renderProc(+m[1] - 1); else if (h === 'quy-trinh') renderToc(); else if (h === 'van-ban') renderRefs(); else hideReader();
}
function go(h) { if (location.hash === '#' + h) route(); else location.hash = h; }
window.addEventListener('hashchange', route);
document.getElementById('rback').addEventListener('click', () => {
  if (history.length > 1 && $reader.dataset.pushed) history.back();
  else { history.replaceState(null, '', location.pathname + location.search); hideReader(); }
});
window.addEventListener('hashchange', () => { $reader.dataset.pushed = '1'; });
$rc.addEventListener('click', e => {
  const j = e.target.closest('[data-jump]'); if (j) { document.getElementById(j.dataset.jump).scrollIntoView({ block: 'start' }); return; }
  const t = e.target.closest('[data-qt]'); if (t) { go('qt-' + (+t.dataset.qt + 1)); return; }
  const c = e.target.closest('[data-code]');
  if (c) {
    $q.value = c.dataset.code; $clear.hidden = false; st.q = c.dataset.code;
    history.replaceState(null, '', location.pathname + location.search); hideReader(); window.scrollTo(0, 0); search();
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$reader.hidden) document.getElementById('rback').click(); });

$list.addEventListener('click', e => {
  const tb = e.target.closest('.ctabs [data-tab]');
  if (tb) {
    const card = tb.closest('.card'), open = tb.getAttribute('aria-selected') === 'true';
    card.querySelectorAll('.ctabs [data-tab]').forEach(b => b.setAttribute('aria-selected', String(!open && b === tb)));
    card.querySelectorAll('.cpane').forEach(p => (p.hidden = open || p.dataset.pane !== tb.dataset.tab));
    return;
  }
  const q = e.target.closest('.openqt'); if (q) { go('qt-' + (+q.dataset.qt + 1)); return; }
  const b = e.target.closest('.copy'); if (!b) return;
  const done = () => { b.textContent = 'Đã chép'; setTimeout(() => b.textContent = b.dataset.label || 'Chép', 1500); };
  try { navigator.clipboard.writeText(b.dataset.copy).then(done, () => selectText(b)); } catch { selectText(b); }
});
$list.addEventListener('keydown', e => {
  const tb = e.target.closest('.ctabs [role=tab]'); if (!tb || !['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) return;
  const all = [...tb.parentNode.children], k = all.indexOf(tb);
  const n = e.key === 'Home' ? 0 : e.key === 'End' ? all.length - 1 : (k + (e.key === 'ArrowRight' ? 1 : -1) + all.length) % all.length;
  all.forEach((b, x) => b.tabIndex = x === n ? 0 : -1); all[n].focus(); e.preventDefault();
});
function selectText(b) { const r = document.createRange(); r.selectNodeContents(b.parentNode); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }

search();
route();
</script>
